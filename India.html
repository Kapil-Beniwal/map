    <!-- Navigation Tabs -->
    <div class="tabs">

    <!-- 1. PRACTICE MODE PANEL -->
    <div id="practice-panel" class="panel active">
        <div id="practice-status" class="status-display">Click anywhere on the map to learn its name!</div>

            <img src="map-of-india.png" usemap="#image-map" class="map-img" alt="Practice Map">
            <canvas class="overlay-canvas"></canvas>
        </div>
    </div>

        </div>
        <div class="map-container">
            <img src="map-of-india.png" usemap="#image-map" class="map-img" alt="Quiz Map">
            <canvas class="overlay-canvas"></canvas>
        </div>
    </div>
