<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Interactive Dashboard</title>
    <style>
        :root {
            /* --bg-color: #0f172a;
            --card-bg: #1e293b; */
             --bg-color: #3b6e39;
            --card-bg: #709d58;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #95f63b;
            --accent-hover: #2563eb;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 50px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 35px 25px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-blue);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2);
        }

        .icon-wrapper {
            background-color: rgba(59, 130, 246, 0.1);
            color: var(--accent-blue);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            transition: var(--transition);
        }

        .card:hover .icon-wrapper {
            background-color: var(--accent-blue);
            color: var(--text-main);
        }

        .card h2 {
            font-size: 1.35rem;
            margin-bottom: 12px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            header p { margin-bottom: 30px; }
            .options-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Welcome to the Dashboard</h1>
            <p>Click the card to practise</p>
        </header>

        <main class="options-grid">
            <a href="India.html" class="card">
                <div class="icon-wrapper">1</div>
                <h2> Learn Indian States</h2>
                <!-- <p>You will get each states location </p> -->
            </a>

            <a href="rajasthan.html" class="card">
                <div class="icon-wrapper">2</div>
                <h2>Rajasthan</h2>
                <!-- <p>Interact with interactive layers, regional spaces, and target segments.</p> -->
            </a>

            <a href="haryana.html" class="card">
                <div class="icon-wrapper">3</div>
                <h2>Haryana</h2>
                <!-- <p>Launch direct testing sequences, structured quizzes, and output validation.</p> -->
            </a>
        </main>
    </div>

</body>
</html>
